name: PixelU Wii (GameCube / Wii) test build

# Builds PixelU's GameCube and Wii engine from pixelu/wii: PixelU-Wii's own
# CMake build (pixelu/wii/CMakeLists.txt, CMake/, Externals/) and sources
# (pixelu/wii/Source, docs/pixelu-wii-original.md). Third-party libraries
# come from their own upstream projects: the sources listed (with commits and
# checksums) in pixelu/wii/Externals/sources.json, Qt's official 6.8.3 MSVC
# build (aqtinstall) and FFmpeg built here from its source. From Dolphin
# 2609a's repository (GPL-2.0-or-later; the commit is the one the
# pixelu/wii/dolphin submodule pins) it takes, in a sparse checkout, only the
# translations (Languages/po) and the few Sys files that are not PixelU-Wii's
# own (GameSettings, ApprovedInis.json, the GameTDB title lists, the OSD font,
# the Gecko code handler and the DSP ROMs; the list is in
# pixelu/wii/CMake/PixelUAssembleSys.cmake). It is its own program
# (PixelU-Wii.exe), separate from PixelU's Wii U part, and is packaged as the
# PixelU\wii\ folder.
# build-linux makes the same program for Linux x86-64 (PixelU/wii/PixelU-Wii,
# Qt's official linux_gcc_64 build next to it; docs/linux-plan.md, L5d).
# The result is a workflow artifact only: no release is made.

on:
  workflow_dispatch:
  push:
    branches: [claude/wiiu-emulator-urpcen]
    paths:
      - "pixelu/wii/**"
      - "pixelu/wii/Source/**"
      - ".gitmodules"
      - ".github/workflows/pixelu-wii.yml"
      - "tools/pixelu-wii-linux-deploy.sh"
      - "tools/pixelu-wii-test-dol.py"

permissions:
  contents: read
  actions: write # to start the RetroPixels bundle once this build is done

concurrency:
  group: pixelu-wii-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    # PixelU-Wii builds with Visual Studio 2026 (its CMake preset uses the
    # "Visual Studio 18 2026" generator and the v145 toolset), which is on
    # this image and not on windows-2022.
    runs-on: windows-2025-vs2026
    timeout-minutes: 240
    env:
      DOLPHIN_TAG: "2609a"
      DOLPHIN_DIR: "pixelu/wii/dolphin"
      QT_VERSION: "6.8.3"
      QT_ARCH: "win64_msvc2022_64"
      AQT_VERSION: "3.3.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch Dolphin's game settings, Sys files and translations (sparse)
        shell: pwsh
        run: |
          # Only what pixelu/wii/CMake/PixelUAssembleSys.cmake takes from
          # Dolphin's Data/Sys, plus Languages/po: no source, no Externals.
          # The commit is the one the pixelu/wii/dolphin submodule pins.
          $sha = (git ls-tree HEAD $env:DOLPHIN_DIR).Split()[2]
          $list = (Get-Content -Raw pixelu/wii/CMake/PixelUAssembleSys.cmake) -replace '(?m)#.*$', ''
          $block = [regex]::Match($list, 'set\(from_third_party(.*?)\n\)', 'Singleline').Groups[1].Value
          $paths = @([regex]::Matches($block, '"([^"]+)"') | ForEach-Object { "/Data/Sys/" + $_.Groups[1].Value })
          $paths += "/Languages/po/"
          "Dolphin $env:DOLPHIN_TAG at $sha, sparse paths:"; $paths
          New-Item -ItemType Directory -Force $env:DOLPHIN_DIR | Out-Null
          git -C $env:DOLPHIN_DIR init -q
          git -C $env:DOLPHIN_DIR remote add origin https://github.com/dolphin-emu/dolphin.git
          git -C $env:DOLPHIN_DIR sparse-checkout set --no-cone @paths
          git -C $env:DOLPHIN_DIR fetch -q --depth 1 --filter=blob:none origin $sha
          if ($LASTEXITCODE) { exit 1 }
          git -C $env:DOLPHIN_DIR -c advice.detachedHead=false checkout -q FETCH_HEAD
          if ($LASTEXITCODE) { exit 1 }
          git -C $env:DOLPHIN_DIR log -1 --format="Dolphin at %H (%s)"
          foreach ($p in $paths) {
            $hits = @(Get-ChildItem -Recurse -File -Path "$env:DOLPHIN_DIR$p" -ErrorAction SilentlyContinue)
            if (-not $hits) { Write-Error "nothing fetched for $p"; exit 1 }
          }
          foreach ($d in "Source", "Externals", "Data/Sys/Themes", "Data/Sys/Shaders") {
            if (Test-Path "$env:DOLPHIN_DIR/$d") { Write-Error "$d was fetched; the checkout must stay sparse"; exit 1 }
          }
          $files = @(Get-ChildItem -Recurse -File $env:DOLPHIN_DIR | Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' })
          "Dolphin checkout: {0} files, {1:N1} MB" -f $files.Count, (($files | Measure-Object Length -Sum).Sum / 1MB)

      # Binaries/Sys is assembled by the build (pixelu/wii/Data/Sys plus the
      # short third-party list in pixelu/wii/CMake/PixelUAssembleSys.cmake),
      # and COPYING and Licenses come from pixelu/wii. No commit or tag is
      # needed: PixelU-Wii's version comes from RetroPixels (main.go and its
      # git commit, Source/Core/Common/PixelUWiiVersion.cmake).

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the third-party sources from their own projects
        shell: pwsh
        run: |
          git config --global core.longpaths true
          python pixelu/wii/Externals/fetch.py --list
          python pixelu/wii/Externals/fetch.py --jobs 8
          if ($LASTEXITCODE) { exit 1 }

      # Qt 6.8.3, the Qt Company's own MSVC 2022 x64 build, base and SVG
      # modules (Dolphin's ext-win-qt was its own build of the same version
      # and modules). aqtinstall checks every archive against the SHA-256 the
      # Qt download server lists for it.
      - uses: actions/cache@v4
        id: qt-cache
        with:
          path: pixelu/wii/third_party/Qt
          key: qt-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}-qtbase-qtsvg-aqt${{ env.AQT_VERSION }}

      - name: Install Qt (official build)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install "aqtinstall==$env:AQT_VERSION"
          if ($LASTEXITCODE) { exit 1 }
          python -m aqt install-qt windows desktop $env:QT_VERSION $env:QT_ARCH --archives qtbase qtsvg -O pixelu/wii/third_party/Qt
          if ($LASTEXITCODE) { exit 1 }

      - name: Check Qt
        shell: pwsh
        run: |
          $qt = "pixelu/wii/third_party/Qt/$env:QT_VERSION/msvc2022_64"
          foreach ($f in "bin/Qt6Core.dll", "bin/Qt6Gui.dll", "bin/Qt6Widgets.dll", "bin/Qt6Svg.dll", "bin/windeployqt.exe", "bin/qtpaths.exe", "bin/moc.exe", "lib/cmake/Qt6/Qt6Config.cmake", "plugins/platforms/qwindows.dll", "plugins/imageformats/qsvg.dll", "plugins/iconengines/qsvgicon.dll", "plugins/styles/qmodernwindowsstyle.dll") {
            if (-not (Test-Path "$qt/$f")) { Write-Error "Qt: missing $f"; exit 1 }
          }
          & "$qt/bin/qtpaths.exe" --qt-query QT_VERSION

      # MSYS2 gives make and nasm for FFmpeg's build and GNU gettext's msgfmt
      # for the translations (Dolphin's prebuilt msgfmt.exe is no longer used).
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MSYS
          update: false
          path-type: inherit
          install: make diffutils mingw-w64-x86_64-nasm mingw-w64-x86_64-gettext-tools

      # FFmpeg: static libraries built from FFmpeg's source at the commit of
      # Dolphin's ext-win-ffmpeg (N-106414-g28d011516b) with the same
      # configuration (Externals/FFmpeg/build-ffmpeg.sh). Cached between runs.
      - uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: pixelu/wii/third_party/FFmpeg/x64
          key: ffmpeg-${{ hashFiles('pixelu/wii/Externals/FFmpeg/build-ffmpeg.sh', 'pixelu/wii/Externals/sources.json') }}

      - name: Fetch FFmpeg's source
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python pixelu/wii/Externals/fetch.py --group ffmpeg
          if ($LASTEXITCODE) { exit 1 }

      - uses: ilammy/msvc-dev-cmd@v1
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        with:
          arch: x64

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/bin:$PATH"
          nasm -v
          bash pixelu/wii/Externals/FFmpeg/build-ffmpeg.sh pixelu/wii/third_party/FFmpeg/ffmpeg pixelu/wii/third_party/FFmpeg/x64

      - name: Check FFmpeg
        shell: pwsh
        run: |
          $ff = "pixelu/wii/third_party/FFmpeg/x64"
          Get-Content "$ff/BUILD-INFO.txt"
          foreach ($l in "avcodec", "avformat", "avutil", "swresample", "swscale") {
            if (-not (Test-Path "$ff/lib/$l.lib")) { Write-Error "FFmpeg: missing lib/$l.lib"; exit 1 }
            if (-not (Test-Path "$ff/include/lib$l/$l.h")) { Write-Error "FFmpeg: missing include/lib$l/$l.h"; exit 1 }
          }
          if (-not (Select-String -Quiet -Path "$ff/include/libavutil/ffversion.h" -Pattern 'N-106414-g28d011516b')) { Write-Error "FFmpeg: not N-106414-g28d011516b"; exit 1 }

      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.2.x"

      - name: Configure
        working-directory: pixelu/wii
        shell: pwsh
        run: |
          # Updater and analytics are off by default in PixelU-Wii's CMake.
          $msgfmt = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "mingw64\bin\msgfmt.exe"
          if (-not (Test-Path $msgfmt)) { Write-Error "msgfmt not found at $msgfmt"; exit 1 }
          & $msgfmt --version | Select-Object -First 1
          cmake --version
          cmake --preset windows-x64-release "-DGETTEXT_MSGFMT_EXECUTABLE=$msgfmt"
          if ($LASTEXITCODE) { exit 1 }

      - name: Build
        working-directory: pixelu/wii
        shell: pwsh
        run: |
          cmake --build --preset windows-x64-release --target dolphin-emu --parallel
          if ($LASTEXITCODE) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          $bin = "pixelu/wii/build/windows-x64-release/Binaries"
          Get-ChildItem $bin | Format-Table Name, Length
          # Windows paths ignore case: "package/PixelU" is not the pixelu source folder.
          $out = "package/PixelU/wii"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "$bin/PixelU-Wii.exe" $out
          Copy-Item "$bin/*.dll" $out
          Copy-Item "$bin/qt.conf" $out
          Copy-Item -Recurse "$bin/QtPlugins" "$out/QtPlugins"
          if (Test-Path "$bin/Languages") { Copy-Item -Recurse "$bin/Languages" "$out/Languages" }
          # Sys was assembled by the build: PixelU-Wii's own pixelu/wii/Data/Sys
          # plus the third-party files listed in PixelUAssembleSys.cmake, taken
          # from Dolphin's Data/Sys. COPYING and Licenses may be symlinks there: copy the real ones.
          Copy-Item -Recurse "$bin/Sys" "$out/Sys"
          # COPYING is PixelU-Wii's own notice (who owns what, which licence
          # applies); license.txt is the full GPL text; Licenses has the
          # licence texts COPYING refers to.
          Copy-Item pixelu/wii/COPYING "$out/COPYING"
          Copy-Item pixelu/wii/LICENSES/GPL-2.0-or-later.txt "$out/license.txt"
          Copy-Item -Recurse pixelu/wii/LICENSES "$out/Licenses"
          # Each third-party project's own licence files (with its copyright
          # lines) go to Licenses/Externals/<project>/: the fetched ones in
          # pixelu/wii/third_party (FFmpeg's from its installed libraries, as
          # its source is only there when it was rebuilt) and the two kept in
          # pixelu/wii/Externals (FreeSurround's licence is in its file
          # headers; its README.txt says where it comes from).
          $pattern = '^(licen[cs]e|copying|copyright|notice|unlicense)([._-].*)?$|copyright'
          $ext_dirs = 0
          $projects = @(Get-ChildItem -Directory pixelu/wii/third_party) + @(Get-Item pixelu/wii/Externals/expr, pixelu/wii/Externals/FreeSurround)
          foreach ($ext in $projects) {
            $found = @(Get-ChildItem -Recurse -File -Depth 2 $ext.FullName | Where-Object { $_.Name -match $pattern -and $_.FullName -notmatch '[\\/]FFmpeg[\\/]ffmpeg[\\/]' })
            if ($ext.Name -eq "FreeSurround") { $found = @(Get-Item "$($ext.FullName)/README.txt") }
            foreach ($f in $found) {
              $dst = Join-Path "$out/Licenses/Externals/$($ext.Name)" ([IO.Path]::GetRelativePath($ext.FullName, $f.FullName))
              New-Item -ItemType Directory -Force (Split-Path $dst) | Out-Null
              Copy-Item -Force $f.FullName $dst
            }
            if ($found) { $ext_dirs++ } else { Write-Host "no licence file found in $($ext.Name)" }
          }
          "Licenses/Externals: licence files of $ext_dirs projects"
          # Dolphin links the Visual C++ runtime as DLLs: ship them next to the
          # exe so it runs without the VC++ Redistributable being installed.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          Write-Host "VC++ runtime from $($crt.FullName)"
          Copy-Item "$($crt.FullName)\*.dll" $out
          # portable.txt: settings, saves and caches stay in the User folder next to the exe.
          "PixelU Wii keeps its settings, saves and caches in the User folder next to PixelU-Wii.exe." | Out-File -Encoding utf8 "$out/portable.txt"
          $sha = git rev-parse --short HEAD
          $dsha = git -C $env:DOLPHIN_DIR rev-parse --short HEAD
          $ver = (Select-String -Path main.go -Pattern 'appVersion\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          @(
            "PixelU Wii $ver test build (GameCube and Wii, based on Dolphin; not a release)"
            "Built $(Get-Date -Format yyyy-MM-dd) from branch claude/wiiu-emulator-urpcen ($sha)"
            "Built with PixelU-Wii's own CMake; third-party libraries from their own projects (pixelu/wii/Externals/sources.json; Qt $env:QT_VERSION official build; FFmpeg built from source); translations and the third-party Sys files from Dolphin $env:DOLPHIN_TAG ($dsha)"
            "Source: https://github.com/shredder565/retropixels/tree/claude/wiiu-emulator-urpcen/pixelu/wii"
            "Dolphin: https://github.com/dolphin-emu/dolphin (Copyright Dolphin Emulator Project)"
            "Copyright and licences: COPYING (the program as a whole: GNU GPL version 2 or later, license.txt); licence texts in Licenses\"
            "No Nintendo keys, firmware, BIOS/IPL or games are included."
          ) | Out-File -Encoding utf8 "$out/VERSION.txt"

      - name: List package contents
        shell: pwsh
        run: |
          $out = "package/PixelU/wii"
          Get-ChildItem $out | Format-Table Mode, Length, Name
          Get-ChildItem -Recurse $out/QtPlugins | Select-Object -ExpandProperty FullName
          "Sys: $((Get-ChildItem -Recurse -File $out/Sys).Count) files"
          $size = (Get-ChildItem -Recurse -File $out | Measure-Object Length -Sum).Sum / 1MB
          "Package size: {0:N1} MB" -f $size
          Get-Content "$out/VERSION.txt"
          foreach ($f in "PixelU-Wii.exe", "Qt6Core.dll", "Qt6Gui.dll", "Qt6Widgets.dll", "qt.conf", "portable.txt", "COPYING", "Sys/GC", "Sys/Wii", "QtPlugins/platforms/qwindows.dll") {
            if (-not (Test-Path "$out/$f")) { Write-Error "missing $f"; exit 1 }
          }
          # PixelU-Wii's own notice, licence texts and pictures are the ones shipped.
          $same = @{
            "COPYING" = "pixelu/wii/COPYING"
            "Licenses/LGPL-3.0-only.txt" = "pixelu/wii/LICENSES/LGPL-3.0-only.txt"
            "Sys/Resources/dolphin_logo.png" = "pixelu/wii/Data/Sys/Resources/dolphin_logo.png"
            "Sys/Resources/nobanner.png" = "pixelu/wii/Data/Sys/Resources/nobanner.png"
          }
          foreach ($k in $same.Keys) {
            if (-not (Test-Path "$out/$k") -or (Get-FileHash "$out/$k").Hash -ne (Get-FileHash $same[$k]).Hash) {
              Write-Error "$k is not PixelU-Wii's own ($($same[$k]))"; exit 1
            }
          }
          if (-not (Test-Path "$out/Sys/GameSettings")) { Write-Error "missing Sys/GameSettings"; exit 1 }
          # Every Sys file is PixelU-Wii's own or on the third-party list, with the
          # right bytes; none of the dropped Dolphin files (other themes and shaders,
          # GraphicMods, totaldb.dsy, its WC24 files and fonts) is there; every
          # theme icon and named shader the program loads is.
          python pixelu/wii/Data/check_sys_package.py "$out/Sys" "$env:DOLPHIN_DIR/Data/Sys"
          if ($LASTEXITCODE) { Write-Error "Sys package check failed"; exit 1 }

      - name: Smoke test (exe starts and prints its version)
        shell: pwsh
        run: |
          $out = (Resolve-Path "package/PixelU/wii").Path
          $p = Start-Process -FilePath "$out\PixelU-Wii.exe" -ArgumentList "--version" -PassThru `
                 -RedirectStandardOutput "$env:RUNNER_TEMP\ver.txt" -RedirectStandardError "$env:RUNNER_TEMP\err.txt"
          if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; Write-Error "PixelU-Wii.exe --version did not exit"; exit 1 }
          "exit code: $($p.ExitCode)"
          Get-Content "$env:RUNNER_TEMP\ver.txt", "$env:RUNNER_TEMP\err.txt" -ErrorAction SilentlyContinue
          # The version is PixelU-Wii's own ("PixelU-Wii 2.21.0"), not Dolphin's tag.
          $said = (Get-Content "$env:RUNNER_TEMP\ver.txt", "$env:RUNNER_TEMP\err.txt" -ErrorAction SilentlyContinue) -join "`n"
          if ($said -and -not $said.Contains("PixelU-Wii")) { Write-Warning "--version did not name PixelU-Wii" }
          # 0xC0000135 = a DLL is missing, 0xC000007B = a DLL is the wrong kind.
          if ($p.ExitCode -lt 0 -or $p.ExitCode -gt 255) { Write-Error ("exe failed to start: 0x{0:X8}" -f $p.ExitCode); exit 1 }
          # It must not have written its settings anywhere but next to itself.
          if (Test-Path "$out\User") { "portable User folder created: OK" }
          Remove-Item -Recurse -Force "$out\User" -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: PixelU-Wii-windows-x64
          path: package/
          retention-days: 14

      - name: Make the RetroPixels download with this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bundle-test.yml -R "${{ github.repository }}" --ref "${{ github.ref_name }}"

  build-linux:
    # The Linux build of PixelU-Wii (docs/linux-plan.md, batch L5d): built on
    # ubuntu-22.04 so glibc 2.35 is the oldest it needs, with GCC 12 (C++23;
    # its libstdc++ is the one Ubuntu 22.04 and Debian 12 ship). Same sources
    # as the Windows job: the third-party libraries from sources.json, Qt
    # 6.8.3's official linux_gcc_64 build (aqtinstall), FFmpeg built from its
    # source, and the sparse Dolphin checkout for translations and the
    # third-party Sys files. tools/pixelu-wii-linux-deploy.sh puts Qt next to
    # the program (lib/, QtPlugins/, $ORIGIN rpath). The artifact
    # PixelU-Wii-linux-x64 holds PixelU-Wii-linux.tar.gz (a tar keeps the exec
    # bits) with PixelU/wii/PixelU-Wii inside; bundle-linux.yml picks it up.
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      DOLPHIN_TAG: "2609a"
      DOLPHIN_DIR: "pixelu/wii/dolphin"
      QT_VERSION: "6.8.3"
      QT_ARCH: "linux_gcc_64"
      AQT_VERSION: "3.3.0"
      BUILD: "pixelu/wii/build/linux-x64-release"
      FFMPEG_OUT: "pixelu/wii/third_party/FFmpeg/linux-x64"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install build and check packages
        run: |
          sudo apt-get update -q
          # Build: compiler, X11/XInput2/xcb, PulseAudio/ALSA and EGL headers (L5a-L5c),
          # nasm for FFmpeg, gettext's msgfmt for the translations, patchelf for the deploy.
          # Run: what Qt's xcb plugin needs (some of it is bundled by the deploy script),
          # Xvfb, openbox, xdotool, PulseAudio, Mesa's llvmpipe and lavapipe.
          sudo apt-get install -y -q --no-install-recommends \
            gcc-12 g++-12 ninja-build pkg-config nasm gettext patchelf \
            libudev-dev libx11-dev libxi-dev libxcb1-dev libpulse-dev libasound2-dev libegl-dev libgl-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-util1 \
            libxcb-xinput0 libxcb-xkb1 libxkbcommon-x11-0 libxcb-randr0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-shm0 libfontconfig1 libfreetype6 libdbus-1-3 libgtk-3-0 \
            xvfb xauth x11-utils xdotool openbox imagemagick pulseaudio pulseaudio-utils \
            mesa-vulkan-drivers libgl1-mesa-dri libegl1 libegl-mesa0 libvulkan1 libx11-xcb1 \
            vulkan-tools mesa-utils
          gcc-12 --version | head -n 1
          ldd --version | head -n 1

      - name: Fetch Dolphin's game settings, Sys files and translations (sparse)
        run: |
          # As in the Windows job: only what PixelUAssembleSys.cmake takes from Dolphin's
          # Data/Sys, plus Languages/po, at the commit the pixelu/wii/dolphin submodule pins.
          set -euo pipefail
          sha=$(git ls-tree HEAD "$DOLPHIN_DIR" | awk '{ print $3 }')
          mapfile -t paths < <(python3 - << 'EOF'
          import re
          text = open("pixelu/wii/CMake/PixelUAssembleSys.cmake").read()
          text = re.sub(r"(?m)#.*$", "", text)
          block = re.search(r"set\(from_third_party(.*?)\n\)", text, re.S).group(1)
          for name in re.findall(r'"([^"]+)"', block):
              print("/Data/Sys/" + name)
          print("/Languages/po/")
          EOF
          )
          echo "Dolphin $DOLPHIN_TAG at $sha, sparse paths:"; printf '  %s\n' "${paths[@]}"
          mkdir -p "$DOLPHIN_DIR"
          git -C "$DOLPHIN_DIR" init -q
          git -C "$DOLPHIN_DIR" remote add origin https://github.com/dolphin-emu/dolphin.git
          git -C "$DOLPHIN_DIR" sparse-checkout set --no-cone "${paths[@]}"
          git -C "$DOLPHIN_DIR" fetch -q --depth 1 --filter=blob:none origin "$sha"
          git -C "$DOLPHIN_DIR" -c advice.detachedHead=false checkout -q FETCH_HEAD
          git -C "$DOLPHIN_DIR" log -1 --format="Dolphin at %H (%s)"
          for p in "${paths[@]}"; do
            # The patterns may be globs (wiitdb-*.txt).
            if ! compgen -G "$DOLPHIN_DIR${p%/}" > /dev/null; then echo "::error::nothing fetched for $p"; exit 1; fi
          done
          for d in Source Externals Data/Sys/Themes Data/Sys/Shaders; do
            if [ -e "$DOLPHIN_DIR/$d" ]; then echo "::error::$d was fetched; the checkout must stay sparse"; exit 1; fi
          done
          echo "Dolphin checkout: $(find "$DOLPHIN_DIR" -path '*/.git' -prune -o -type f -print | wc -l) files"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the third-party sources from their own projects
        run: |
          python pixelu/wii/Externals/fetch.py --list
          python pixelu/wii/Externals/fetch.py --jobs 8

      # Qt 6.8.3, the Qt Company's own Linux x64 build: base, SVG, the Wayland
      # client plugins and the ICU that build links. aqtinstall checks every
      # archive against the SHA-256 the Qt download server lists for it.
      - uses: actions/cache@v4
        id: qt-cache
        with:
          path: pixelu/wii/third_party/Qt
          key: qt-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}-qtbase-qtsvg-qtwayland-icu-aqt${{ env.AQT_VERSION }}

      - name: Install Qt (official build)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install "aqtinstall==$AQT_VERSION"
          python -m aqt install-qt linux desktop "$QT_VERSION" "$QT_ARCH" --archives qtbase qtsvg qtwayland icu -O pixelu/wii/third_party/Qt

      - name: Check Qt
        run: |
          qt="pixelu/wii/third_party/Qt/$QT_VERSION/gcc_64"
          for f in lib/libQt6Core.so.6 lib/libQt6Gui.so.6 lib/libQt6Widgets.so.6 lib/libQt6Svg.so.6 \
                   lib/libQt6XcbQpa.so.6 lib/libQt6DBus.so.6 lib/cmake/Qt6/Qt6Config.cmake libexec/moc bin/qtpaths \
                   plugins/platforms/libqxcb.so plugins/imageformats/libqsvg.so plugins/iconengines/libqsvgicon.so; do
            [ -e "$qt/$f" ] || { echo "::error::Qt: missing $f"; exit 1; }
          done
          [ -e "$qt/plugins/platforms/libqwayland-generic.so" ] || echo "::warning::Qt has no Wayland platform plugin (qtwayland archive); the package will run on X11/XWayland only"
          "$qt/bin/qtpaths" --qt-query QT_VERSION
          # ICU and everything else Qt Core and the xcb plugin need must resolve.
          if LD_LIBRARY_PATH="$qt/lib" ldd "$qt/lib/libQt6Core.so.6" "$qt/plugins/platforms/libqxcb.so" | grep 'not found'; then
            echo "::error::Qt's libraries do not resolve"; exit 1
          fi

      # FFmpeg for frame dumps (RetroPixels' recording): static libraries built
      # from the same FFmpeg source and configuration as the Windows job
      # (Externals/FFmpeg/build-ffmpeg.sh), here with the host's GCC.
      - uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: ${{ env.FFMPEG_OUT }}
          key: ffmpeg-linux-ubuntu22.04-${{ hashFiles('pixelu/wii/Externals/FFmpeg/build-ffmpeg.sh', 'pixelu/wii/Externals/sources.json') }}

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          python pixelu/wii/Externals/fetch.py --group ffmpeg
          PIXELU_FFMPEG_HOST_TEST=1 bash pixelu/wii/Externals/FFmpeg/build-ffmpeg.sh pixelu/wii/third_party/FFmpeg/ffmpeg "$FFMPEG_OUT"

      - name: Check FFmpeg
        run: |
          cat "$FFMPEG_OUT/BUILD-INFO.txt"
          for l in avcodec avformat avutil swresample swscale; do
            [ -f "$FFMPEG_OUT/lib/lib$l.a" ] || { echo "::error::FFmpeg: missing lib/lib$l.a"; exit 1; }
            [ -f "$FFMPEG_OUT/include/lib$l/$l.h" ] || { echo "::error::FFmpeg: missing include/lib$l/$l.h"; exit 1; }
          done
          grep -q 'N-106414-g28d011516b' "$FFMPEG_OUT/include/libavutil/ffversion.h" || { echo "::error::FFmpeg: not N-106414-g28d011516b"; exit 1; }

      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "4.2.x"

      - name: Configure
        run: |
          cmake --version
          # No LLVM: the debugger's host disassembly would link the runner's libLLVM.
          cmake -S pixelu/wii -B "$BUILD" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-12 -DCMAKE_CXX_COMPILER=g++-12 -DENABLE_LLVM=OFF \
            -DPIXELU_WII_FFMPEG_DIR="$PWD/$FFMPEG_OUT" 2>&1 | tee "$RUNNER_TEMP/configure.txt"
          test "${PIPESTATUS[0]}" = 0
          grep -q 'FFmpeg found: frame dumps are encoded' "$RUNNER_TEMP/configure.txt" || { echo "::error::FFmpeg was not found"; exit 1; }
          grep -q "Qt $QT_VERSION" "$RUNNER_TEMP/configure.txt" || { echo "::error::not configured with Qt $QT_VERSION"; exit 1; }

      - name: Build
        run: |
          ninja -C "$BUILD" dolphin-emu dolphin-emu-nogui dolphin-tool pixelu-wii-input-check pixelu-wii-dock-check

      - name: Check the programs (libraries, glibc floor)
        run: |
          set -euo pipefail
          bin="$BUILD/Binaries"
          ls -la "$bin"
          for p in PixelU-Wii dolphin-emu-nogui dolphin-tool; do
            echo "== $p"
            readelf -d "$bin/$p" | grep -E 'NEEDED|RUNPATH|RPATH'
            floor=$(objdump -T "$bin/$p" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
            echo "newest glibc symbol: $floor"
            if [ "$(printf '%s\nGLIBC_2.35\n' "$floor" | sort -V | tail -n 1)" != "GLIBC_2.35" ]; then
              echo "::error::$p needs $floor (more than glibc 2.35)"; exit 1
            fi
            if readelf -d "$bin/$p" | grep -q 'libLLVM'; then echo "::error::$p links libLLVM"; exit 1; fi
          done

      - name: Package
        run: |
          set -euo pipefail
          bin="$BUILD/Binaries"
          out="package/PixelU/wii"
          mkdir -p "$out"
          # The program with Qt next to it (lib/, QtPlugins/, qt.conf).
          bash tools/pixelu-wii-linux-deploy.sh "$bin/PixelU-Wii" "pixelu/wii/third_party/Qt/$QT_VERSION/gcc_64" "$out"
          if [ -d "$bin/Languages" ]; then cp -R "$bin/Languages" "$out/Languages"; fi
          # Sys was assembled by the build: PixelU-Wii's own pixelu/wii/Data/Sys plus the
          # third-party files listed in PixelUAssembleSys.cmake, taken from Dolphin's Data/Sys.
          cp -RL "$bin/Sys" "$out/Sys"
          # COPYING is PixelU-Wii's own notice, license.txt the full GPL text, Licenses the
          # licence texts COPYING refers to.
          cp pixelu/wii/COPYING "$out/COPYING"
          cp pixelu/wii/LICENSES/GPL-2.0-or-later.txt "$out/license.txt"
          cp -R pixelu/wii/LICENSES "$out/Licenses"
          # Each third-party project's own licence files go to Licenses/Externals/<project>/
          # (the same rule as the Windows job; Qt's are there too).
          ext_dirs=0
          for ext in pixelu/wii/third_party/*/ pixelu/wii/Externals/expr/ pixelu/wii/Externals/FreeSurround/; do
            ext=${ext%/}
            name=$(basename "$ext")
            if [ "$name" = FreeSurround ]; then
              found="$ext/README.txt"
            else
              found=$(find "$ext" -maxdepth 3 -type f -not -path '*/FFmpeg/ffmpeg/*' | grep -iE '/((licen[cs]e|copying|copyright|notice|unlicense)([._-][^/]*)?|[^/]*copyright[^/]*)$' || true)
            fi
            if [ -z "$found" ]; then echo "no licence file found in $name"; continue; fi
            while IFS= read -r f; do
              dst="$out/Licenses/Externals/$name/${f#"$ext"/}"
              mkdir -p "$(dirname "$dst")"
              cp -f "$f" "$dst"
            done <<< "$found"
            ext_dirs=$((ext_dirs + 1))
          done
          echo "Licenses/Externals: licence files of $ext_dirs projects"
          # portable.txt: settings, saves and caches stay in the User folder next to the program.
          echo "PixelU Wii keeps its settings, saves and caches in the User folder next to PixelU-Wii." > "$out/portable.txt"
          sha=$(git rev-parse --short HEAD)
          dsha=$(git -C "$DOLPHIN_DIR" rev-parse --short HEAD)
          ver=$(sed -n 's/.*appVersion *= *"\([^"]*\)".*/\1/p' main.go | head -n 1)
          {
            echo "PixelU Wii $ver test build for Linux x86-64 (GameCube and Wii, based on Dolphin; not a release)"
            echo "Built $(date -u +%Y-%m-%d) from branch claude/wiiu-emulator-urpcen ($sha) on Ubuntu 22.04 (glibc 2.35 or newer needed)"
            echo "Built with PixelU-Wii's own CMake; third-party libraries from their own projects (pixelu/wii/Externals/sources.json; Qt $QT_VERSION official build; FFmpeg built from source); translations and the third-party Sys files from Dolphin $DOLPHIN_TAG ($dsha)"
            echo "Source: https://github.com/shredder565/retropixels/tree/claude/wiiu-emulator-urpcen/pixelu/wii"
            echo "Dolphin: https://github.com/dolphin-emu/dolphin (Copyright Dolphin Emulator Project)"
            echo "Copyright and licences: COPYING (the program as a whole: GNU GPL version 2 or later, license.txt); licence texts in Licenses/"
            echo "No Nintendo keys, firmware, BIOS/IPL or games are included."
          } > "$out/VERSION.txt"

      - name: List and check package contents
        run: |
          set -euo pipefail
          out="package/PixelU/wii"
          ls -la "$out"
          find "$out/QtPlugins" -type f
          echo "Sys: $(find "$out/Sys" -type f | wc -l) files"
          du -sh "$out"
          cat "$out/VERSION.txt"
          for f in PixelU-Wii lib/libQt6Core.so.6 lib/libQt6Gui.so.6 lib/libQt6Widgets.so.6 qt.conf portable.txt COPYING Sys/GC Sys/Wii Sys/GameSettings QtPlugins/platforms/libqxcb.so; do
            [ -e "$out/$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          [ -x "$out/PixelU-Wii" ] || { echo "::error::PixelU-Wii is not executable"; exit 1; }
          for pair in COPYING=pixelu/wii/COPYING Licenses/LGPL-3.0-only.txt=pixelu/wii/LICENSES/LGPL-3.0-only.txt \
                      Sys/Resources/dolphin_logo.png=pixelu/wii/Data/Sys/Resources/dolphin_logo.png \
                      Sys/Resources/nobanner.png=pixelu/wii/Data/Sys/Resources/nobanner.png; do
            cmp "$out/${pair%%=*}" "${pair#*=}" || { echo "::error::${pair%%=*} is not PixelU-Wii's own"; exit 1; }
          done
          python pixelu/wii/Data/check_sys_package.py "$out/Sys" "$DOLPHIN_DIR/Data/Sys"
          # The glibc floor of everything shipped.
          floor=$(find "$out" -type f \( -name PixelU-Wii -o -name '*.so*' \) -exec objdump -T {} + 2> /dev/null | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
          echo "newest glibc symbol in the package: $floor"
          if [ "$(printf '%s\nGLIBC_2.35\n' "$floor" | sort -V | tail -n 1)" != "GLIBC_2.35" ]; then
            echo "::error::the package needs $floor (more than glibc 2.35)"; exit 1
          fi

      - name: Smoke test (the program starts and prints its version)
        run: |
          set -euo pipefail
          out="$PWD/package/PixelU/wii"
          # No X server needed for --version.
          QT_QPA_PLATFORM=offscreen timeout 60 "$out/PixelU-Wii" --version > "$RUNNER_TEMP/ver.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/ver.txt"
          echo "exit status ${status:-0}"
          grep -q 'PixelU-Wii' "$RUNNER_TEMP/ver.txt" || { echo "::error::--version did not name PixelU-Wii"; exit 1; }
          # It wrote its settings only next to itself (portable.txt).
          if [ -d "$out/User" ]; then echo "portable User folder created: OK"; else echo "::warning::no User folder next to the program"; fi
          rm -rf "$out/User"
          if [ -d "$HOME/.local/share/dolphin-emu" ] || [ -d "$HOME/.config/dolphin-emu" ]; then
            echo "::error::PixelU-Wii wrote to the home folder despite portable.txt"; exit 1
          fi

      - name: Start Xvfb and PulseAudio
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          for _ in $(seq 50); do xdpyinfo -display :99 > /dev/null 2>&1 && break; sleep 0.2; done
          xdpyinfo -display :99 | grep -E 'version number|XInputExtension|dimensions'
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=null
          pactl info | grep -E 'Server Name|Default Sink'
          DISPLAY=:99 glxinfo -B | grep -E 'OpenGL renderer|OpenGL core profile version'
          vulkaninfo --summary | grep -E 'deviceName|apiVersion' || true
          python3 tools/pixelu-wii-test-dol.py "$RUNNER_TEMP/test.dol"

      - name: Check keyboard, mouse and controllers (XInput2, SDL virtual pad)
        run: |
          timeout 300 "$BUILD/Binaries/pixelu-wii-input-check" "$RUNNER_TEMP/input-user"

      - name: Check nogui start-up (headless, Null video)
        run: |
          set -euo pipefail
          u="$RUNNER_TEMP/nogui-user"
          "$BUILD/Binaries/dolphin-emu-nogui" --version
          "$BUILD/Binaries/dolphin-emu-nogui" -u "$u" -v Null -C Logger.Logs.BOOT=True -C Logger.Logs.CONSOLE=True -C Logger.Options.Verbosity=4 \
            -C Logger.Options.WriteToConsole=True -e "$RUNNER_TEMP/test.dol" > "$RUNNER_TEMP/nogui.txt" 2>&1 &
          pid=$!
          sleep 8
          kill -0 "$pid" || { cat "$RUNNER_TEMP/nogui.txt"; echo "::error::nogui ended early"; exit 1; }
          kill -INT "$pid"
          status=0
          timeout 10 tail --pid="$pid" -f /dev/null || { echo "::error::nogui did not stop"; kill -9 "$pid"; exit 1; }
          wait "$pid" || status=$?
          tail -n 30 "$RUNNER_TEMP/nogui.txt"
          [ "$status" = 0 ] || { echo "::error::nogui exited $status"; exit 1; }
          grep -q 'Booting from executable' "$RUNNER_TEMP/nogui.txt" || { echo "::error::no 'Booting from executable'"; exit 1; }
          grep -q 'Shutdown complete' "$RUNNER_TEMP/nogui.txt" || { echo "::error::no 'Shutdown complete'"; exit 1; }

      - name: Check sound (cubeb through PulseAudio)
        run: |
          set -euo pipefail
          "$BUILD/Binaries/dolphin-emu-nogui" -u "$RUNNER_TEMP/sound-user" -v Null -C Dolphin.DSP.Backend=Cubeb \
            -C Logger.Logs.AUDIO=True -C Logger.Options.Verbosity=4 -C Logger.Options.WriteToConsole=True \
            -e "$RUNNER_TEMP/test.dol" > "$RUNNER_TEMP/sound.txt" 2>&1 &
          pid=$!
          sleep 8
          pactl list sink-inputs | tee "$RUNNER_TEMP/sinks.txt" | grep -E 'application\.(name|process\.id)' || true
          kill -INT "$pid"; wait "$pid" || true
          grep -q 'Cubeb initialized using pulse backend' "$RUNNER_TEMP/sound.txt" || { tail -n 30 "$RUNNER_TEMP/sound.txt"; echo "::error::cubeb did not use PulseAudio"; exit 1; }
          grep -q "application.process.id = \"$pid\"" "$RUNNER_TEMP/sinks.txt" || { echo "::error::no PulseAudio stream of the nogui process"; exit 1; }

      - name: Check the game on screen (nogui -p x11 and the Qt program, OpenGL and Vulkan)
        run: |
          set -euo pipefail
          check="$BUILD/Binaries/pixelu-wii-dock-check"
          app="$PWD/package/PixelU/wii/PixelU-Wii"
          for backend in OGL Vulkan; do
            echo "== nogui -p x11, $backend"
            timeout 180 "$check" nogui "$BUILD/Binaries/dolphin-emu-nogui" "$RUNNER_TEMP/test.dol" "$RUNNER_TEMP/x11-$backend" "$backend"
            echo "== PixelU-Wii, $backend"
            timeout 180 "$check" plain "$app" "$RUNNER_TEMP/test.dol" "$RUNNER_TEMP/qt-$backend" "$backend"
          done

      - name: Check docking into RetroPixels (stand-in app window)
        run: |
          set -euo pipefail
          check="$BUILD/Binaries/pixelu-wii-dock-check"
          app="$PWD/package/PixelU/wii/PixelU-Wii"
          # Nobody docks it: after 20 s it becomes an ordinary window (no window manager).
          timeout 180 "$check" give-up "$app" "$RUNNER_TEMP/test.dol" "$RUNNER_TEMP/dock-giveup"
          # With a window manager, as on a desktop: it must never reach the window manager
          # while it waits, and stays docked. PIXELU_EMBED=1 (what RetroPixels sets), then --rp-embed.
          openbox > "$RUNNER_TEMP/openbox.log" 2>&1 &
          sleep 2
          timeout 180 "$check" dock "$app" "$RUNNER_TEMP/test.dol" "$RUNNER_TEMP/dock-env"
          timeout 180 "$check" rp-embed "$app" "$RUNNER_TEMP/test.dol" "$RUNNER_TEMP/dock-flag" Vulkan
          kill %1 || true
          # None of the runs registered anything in the home folder (Discord's URL handler).
          if compgen -G "$HOME/.local/share/applications/discord-*.desktop" > /dev/null; then
            echo "::error::a run wrote a discord-*.desktop file to ~/.local/share/applications"; exit 1
          fi

      - name: Make the tar.gz
        run: |
          rm -rf package/PixelU/wii/User
          tar -czf PixelU-Wii-linux.tar.gz -C package PixelU
          tar -tzvf PixelU-Wii-linux.tar.gz | grep -E ' PixelU/wii/PixelU-Wii$'
          ls -l PixelU-Wii-linux.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: PixelU-Wii-linux-x64
          path: PixelU-Wii-linux.tar.gz
          compression-level: 0
          retention-days: 14

      - name: Make the RetroPixels Linux download with this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bundle-linux.yml -R "${{ github.repository }}" --ref "${{ github.ref_name }}"
