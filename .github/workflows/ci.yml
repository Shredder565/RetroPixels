name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      publish: ${{ steps.rel.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check emulator scripts
        run: for f in web/emu/*.js; do node --check "$f"; done

      - name: Test
        run: go test ./...

      - name: SNES Debugger tests
        run: cd tools/snes-debugger && cargo test --no-default-features

      - name: Program icon and version details
        run: sh tools/make-winres.sh && sh tools/make-winres-native.sh

      - name: Build Windows executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          version=$(sed -n 's/.*appVersion = "\(.*\)"/\1/p' main.go)
          go build -trimpath -ldflags "-s -w -H windowsgui" -o RetroPixels.exe .
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$version" -o RetroPixels-Native.exe ./cmd/retropixels-native

      # MAME comes in the download: the MAME team's official Windows release,
      # unchanged, checked against GitHub's SHA-256 for it, with its source code
      # going in the release.
      - name: Built-in MAME
        id: mame
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*appVersion = "\(.*\)"/\1/p' main.go)
          go run ./tools/bundlemame -dir "dist/RetroPixels-$version/MAME" -source dist/mame-source.tar.gz
          v=$(sed -n 's/^version=//p' "$GITHUB_OUTPUT" | tail -n 1)
          mv dist/mame-source.tar.gz "dist/MAME-$v-source.tar.gz"
          ls -la "dist/RetroPixels-$version/MAME"/*/ | head -n 30

      - name: Package
        id: pkg
        run: |
          version=$(sed -n 's/.*appVersion = "\(.*\)"/\1/p' main.go)
          dir="RetroPixels-$version"
          mkdir -p "dist/$dir"
          cp RetroPixels.exe RetroPixels-Native.exe README.txt VERSION.txt CHANGELOG.txt "dist/$dir/"
          cp wiiu/testdata/demo.rpx "dist/$dir/RetroPixels Wii U demo.rpx"
          (cd dist && zip -qr "$dir.zip" "$dir")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=dist/$dir.zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: RetroPixels-${{ steps.pkg.outputs.version }}
          path: ${{ steps.pkg.outputs.zip }}

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "${{ steps.pkg.outputs.version }}"

      # A new app version on main (or a version tag) publishes its release once.
      - name: Is this version released yet?
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.pkg.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = push ] && { [ "${{ github.ref }}" = refs/heads/main ] || [ "${{ github.ref_type }}" = tag ]; }; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes
        if: steps.rel.outputs.publish == 'true'
        run: |
          v="${{ steps.pkg.outputs.version }}"
          {
            echo "## Download"
            echo
            echo "- **RetroPixels-$v.zip**: the app (RetroPixels.exe and the RetroPixels-Native.exe test build, with README, VERSION, CHANGELOG and a Wii U demo program), with MAME ${{ steps.mame.outputs.version }} built in for arcade games. Unzip and run \`RetroPixels.exe\`."
            echo "- **RetroPixels.exe**: the program on its own."
            echo "- **RetroPixels-Native.exe**: test build of the native version (no Chromium; every system, plus Archipelago)."
            echo "- **RetroPixels-source-$v.zip**: the full source code."
            echo "- **MAME-${{ steps.mame.outputs.version }}-source.tar.gz**: the source code of the built-in MAME. It's the MAME team's official release ${{ steps.mame.outputs.tag }}, unchanged (https://github.com/mamedev/mame/releases/tag/${{ steps.mame.outputs.tag }}, SHA-256 ${{ steps.mame.outputs.sha256 }}), licensed under the GPL, version 2 or later."
            echo "- **RetroPixels-$v.apk**: RetroPixels for Android (Android 7 or newer; open it on the phone to install)."
            echo "- **RetroPixels-Android-Studio-$v.zip**: the Android app as an Android Studio project, with its emulator engine prebuilt."
            echo
            echo "Windows 10 / 11, 64-bit. The program isn't code-signed yet, so SmartScreen may say \"Windows protected your PC\": click **More info**, then **Run anyway**. No games, BIOS or firmware are included."
            echo
            echo "## What's new"
            echo
            awk -v h="## [$v]" 'index($0,h)==1{on=1;next} on&&/^## /{exit} on' CHANGELOG.md
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
          } > dist/notes.md
          git archive --format=zip --prefix="RetroPixels-source-$v/" -o "dist/RetroPixels-source-$v.zip" HEAD
          cp RetroPixels.exe RetroPixels-Native.exe dist/
          (cd dist && sha256sum RetroPixels-*.zip RetroPixels.exe RetroPixels-Native.exe MAME-*-source.tar.gz > SHA256SUMS.txt)

      - name: Publish release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: RetroPixels ${{ steps.pkg.outputs.version }}
          body_path: dist/notes.md
          make_latest: true
          files: |
            dist/RetroPixels-${{ steps.pkg.outputs.version }}.zip
            dist/RetroPixels.exe
            dist/RetroPixels-Native.exe
            dist/RetroPixels-source-${{ steps.pkg.outputs.version }}.zip
            dist/MAME-${{ steps.mame.outputs.version }}-source.tar.gz
            dist/SHA256SUMS.txt

  # RetroPixels for Android: the APK and the Android Studio project zip.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # the armeabi-v7a and x86 engines are 32-bit programs
      - name: Engine tests, 32-bit
        env:
          GOARCH: "386"
          CGO_ENABLED: "0"
        run: go test ./cmd/retropixels-android/ ./internal/...

      - name: Engine for this computer, for the app's Java tests
        env:
          CGO_ENABLED: "0"
        run: go build -o "$RUNNER_TEMP/rpengine" ./cmd/retropixels-android

      - name: Java tests
        working-directory: android
        env:
          RP_ENGINE: ${{ runner.temp }}/rpengine
        run: ./gradlew --no-daemon testReleaseUnitTest

      # buildEngine (before preBuild) builds the engine for the four Android CPUs with Go
      - name: Build the APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Package
        id: pkg
        run: |
          version=$(sed -n 's/.*appVersion = "\(.*\)"/\1/p' main.go)
          mkdir -p android-dist
          cp android/app/build/outputs/apk/release/app-release.apk "android-dist/RetroPixels-$version.apk"
          sh android/tools/make-studio-zip.sh android-dist
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | tail -n 1)
          [ -z "$aapt" ] || "$aapt" dump badging "android-dist/RetroPixels-$version.apk" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: RetroPixels-Android-${{ steps.pkg.outputs.version }}
          path: android-dist/

  # Adds the Android files to the release the build job just published.
  android-release:
    needs: [build, android]
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RetroPixels-Android-${{ needs.build.outputs.version }}
          path: android-dist

      - name: Add to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          files: |
            android-dist/RetroPixels-${{ needs.build.outputs.version }}.apk
            android-dist/RetroPixels-Android-Studio-${{ needs.build.outputs.version }}.zip
