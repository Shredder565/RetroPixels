name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check emulator scripts
        run: for f in web/emu/*.js; do node --check "$f"; done

      - name: Test
        run: go test ./...

      - name: Program icon and version details
        run: sh tools/make-winres.sh && sh tools/make-winres-native.sh

      - name: Build Windows executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          version=$(sed -n 's/.*appVersion = "\(.*\)"/\1/p' main.go)
          go build -trimpath -ldflags "-s -w -H windowsgui" -o RetroPixels.exe .
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$version" -o RetroPixels-Native.exe ./cmd/retropixels-native

      - name: Package
        id: pkg
        run: |
          version=$(sed -n 's/.*appVersion = "\(.*\)"/\1/p' main.go)
          dir="RetroPixels-$version"
          mkdir -p "dist/$dir"
          cp RetroPixels.exe RetroPixels-Native.exe README.txt VERSION.txt CHANGELOG.txt "dist/$dir/"
          (cd dist && zip -qr "$dir.zip" "$dir")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=dist/$dir.zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: RetroPixels-${{ steps.pkg.outputs.version }}
          path: ${{ steps.pkg.outputs.zip }}

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "${{ steps.pkg.outputs.version }}"

      # A new app version on main (or a version tag) publishes its release once.
      - name: Is this version released yet?
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.pkg.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = push ] && { [ "${{ github.ref }}" = refs/heads/main ] || [ "${{ github.ref_type }}" = tag ]; }; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes
        if: steps.rel.outputs.publish == 'true'
        run: |
          v="${{ steps.pkg.outputs.version }}"
          {
            echo "## Download"
            echo
            echo "- **RetroPixels-$v.zip**: the app (RetroPixels.exe and the RetroPixels-Native.exe test build, with README, VERSION and CHANGELOG). Unzip and run \`RetroPixels.exe\`."
            echo "- **RetroPixels.exe**: the program on its own."
            echo "- **RetroPixels-Native.exe**: test build of the native version (no Chromium; NES, Atari 2600, Master System, Game Boy / Color and Atari 7800 so far)."
            echo "- **RetroPixels-source-$v.zip**: the full source code."
            echo
            echo "Windows 10 / 11, 64-bit. The program isn't code-signed yet, so SmartScreen may say \"Windows protected your PC\": click **More info**, then **Run anyway**. No games, BIOS or firmware are included."
            echo
            echo "## What's new"
            echo
            awk -v h="## [$v]" 'index($0,h)==1{on=1;next} on&&/^## /{exit} on' CHANGELOG.md
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)"
          } > dist/notes.md
          git archive --format=zip --prefix="RetroPixels-source-$v/" -o "dist/RetroPixels-source-$v.zip" HEAD
          cp RetroPixels.exe RetroPixels-Native.exe dist/
          (cd dist && sha256sum RetroPixels-*.zip RetroPixels.exe RetroPixels-Native.exe > SHA256SUMS.txt)

      - name: Publish release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: RetroPixels ${{ steps.pkg.outputs.version }}
          body_path: dist/notes.md
          make_latest: true
          files: |
            dist/RetroPixels-${{ steps.pkg.outputs.version }}.zip
            dist/RetroPixels.exe
            dist/RetroPixels-Native.exe
            dist/RetroPixels-source-${{ steps.pkg.outputs.version }}.zip
            dist/SHA256SUMS.txt
