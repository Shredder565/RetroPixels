name: RetroPixels with PixelU (test build)

# One download with everything: RetroPixels.exe and RetroPixels-Native.exe,
# built from this commit, with PixelU inside (the Wii U engine and the
# GameCube / Wii engine, from their latest successful builds on this branch)
# the built-in MAME, Supermodel (Sega Model 3, built from this commit by
# supermodel.yml) and RPCS3 (PlayStation 3, the RPCS3 team's official
# Windows build, pinned below). A workflow artifact only: no release is made.
# The run shows only that one download: the Supermodel build it was made
# from (an artifact of this run) is deleted once it's in the bundle.
# It runs on each push, and again when a PixelU engine build finishes (those
# workflows start it, since workflow_run only works from the default branch).

# release.yml calls it with release: true: then the version has no -testN,
# VERSION.txt says it's a release, and the release files (the zip, the two
# programs and the MAME source) go in the RetroPixels-release artifact.

on:
  workflow_dispatch:
  push:
    branches: [claude/wiiu-emulator-urpcen]
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

# actions: write lets the bundle job delete this run's intermediate
# Supermodel artifact (callers such as release.yml must grant it too).
permissions:
  contents: read
  actions: write

concurrency:
  group: bundle-test-${{ inputs.release && 'release' || 'test' }}
  cancel-in-progress: ${{ !inputs.release }}

jobs:
  # supermodel.exe from supermodel/ at this commit (RetroPixels' own Model 3
  # engine). Only the Windows build: the Linux one belongs to bundle-linux.yml.
  supermodel:
    uses: ./.github/workflows/supermodel.yml
    with:
      targets: windows

  bundle:
    needs: supermodel
    runs-on: ubuntu-latest
    env:
      BRANCH: claude/wiiu-emulator-urpcen
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Test
        run: go test ./...

      - name: Build RetroPixels
        run: |
          v=$(sed -n 's/.*appVersion = "\(.*\)"/\1/p' main.go)
          if [ "${{ inputs.release }}" != true ]; then v=$v-test${{ github.run_number }}; fi
          echo "VER=$v" >> "$GITHUB_ENV"
          echo "DIR=dist/RetroPixels-$v" >> "$GITHUB_ENV"
          sh tools/make-winres.sh && sh tools/make-winres-native.sh
          export GOOS=windows GOARCH=amd64 CGO_ENABLED=0
          mkdir -p "dist/RetroPixels-$v"
          go build -trimpath -ldflags "-s -w -H windowsgui" -o "dist/RetroPixels-$v/RetroPixels.exe" .
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$v" -o "dist/RetroPixels-$v/RetroPixels-Native.exe" ./cmd/retropixels-native

      # The newest successful builds of PixelU's two engines on this branch.
      - name: PixelU (Wii U and GameCube / Wii engines)
        run: |
          get() { # workflow file, artifact name
            id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$1" --branch "$BRANCH" --status success -L 1 --json databaseId -q '.[0].databaseId')
            [ -n "$id" ] || { echo "no successful run of $1"; exit 1; }
            sha=$(gh run view -R "$GITHUB_REPOSITORY" "$id" --json headSha -q .headSha)
            echo "$1: run $id ($sha)"
            echo "$1 $id ${sha:0:7}" >> engines.txt
            gh run download -R "$GITHUB_REPOSITORY" "$id" -n "$2" -D "eng/$2"
          }
          get pixelu.yml PixelU-windows-x64
          get pixelu-wii.yml PixelU-Wii-windows-x64
          mkdir -p "$DIR/PixelU"
          cp -r eng/PixelU-windows-x64/PixelU/. "$DIR/PixelU/"
          cp -r eng/PixelU-Wii-windows-x64/PixelU/wii "$DIR/PixelU/wii"
          test -f "$DIR/PixelU/PixelU.exe" && test -f "$DIR/PixelU/wii/PixelU-Wii.exe"

      - name: Built-in MAME
        id: mame
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./tools/bundlemame -dir "$DIR/MAME" -source dist/mame-source.tar.gz

      - uses: actions/download-artifact@v4
        with:
          name: Supermodel-windows-x64
          path: eng/Supermodel-windows-x64

      - name: Supermodel (Sega Model 3)
        run: |
          mkdir -p "$DIR/Supermodel"
          cp -r eng/Supermodel-windows-x64/Supermodel/. "$DIR/Supermodel/"
          test -f "$DIR/Supermodel/supermodel.exe" && test -f "$DIR/Supermodel/Config/Games.xml"
          test -f "$DIR/Supermodel/LICENSE.txt" && test -f "$DIR/Supermodel/THIRD-PARTY-NOTICES.txt"

      # RPCS3, the RPCS3 team's official Windows build, unchanged, from their
      # own releases (RPCS3/rpcs3-binaries-win; the tag is build-<the RPCS3
      # commit>), pinned and checked by SHA-256 so the bundle is reproducible.
      # Its GPL-2.0 licence comes from the same RPCS3 commit. RetroPixels
      # copies it to %APPDATA%\RetroPixels\RPCS3 and runs it from there
      # (internal/rpcs3/bundled.go). No PS3 firmware, keys, licences or games.
      # To update: a newer release's tag, file name, version and both hashes.
      - name: RPCS3 (PlayStation 3)
        env:
          RPCS3_VERSION: 0.0.43-20267
          RPCS3_COMMIT: ff91404b7ce1dad03fa022c1f2ab5cf885c97f64
          RPCS3_FILE: rpcs3-v0.0.43-20267-ff91404b_win64_msvc.7z
          RPCS3_SHA256: dae7c9cd019945099bbe3a83f95b9f96b07d7cb8d488bcc9325c83d097497ece
          RPCS3_LICENSE_SHA256: 39db8f9acf036595a2566ea3fe560bc7bd65d8749f088e0f4a4ef2f8a6cb4b34
        run: |
          tag="build-$RPCS3_COMMIT"
          curl -fsSL --retry 3 -o rpcs3.7z "https://github.com/RPCS3/rpcs3-binaries-win/releases/download/$tag/$RPCS3_FILE"
          echo "$RPCS3_SHA256  rpcs3.7z" | sha256sum -c -
          curl -fsSL --retry 3 -o rpcs3-LICENSE "https://raw.githubusercontent.com/RPCS3/rpcs3/$RPCS3_COMMIT/LICENSE"
          echo "$RPCS3_LICENSE_SHA256  rpcs3-LICENSE" | sha256sum -c -
          mkdir -p "$DIR/RPCS3"
          7z x -y -bd -o"$DIR/RPCS3" rpcs3.7z > /dev/null
          rm rpcs3.7z
          test -f "$DIR/RPCS3/rpcs3.exe" && test -f "$DIR/RPCS3/Qt6Core.dll"
          # Never the player's things: no system software, keys, licences or games.
          for d in dev_hdd0 dev_hdd1 dev_flash dev_flash2 dev_flash3 dev_usb000 dev_bdvd; do
            if [ -e "$DIR/RPCS3/$d" ]; then echo "::error::the RPCS3 build has $d"; exit 1; fi
          done
          bad=$(find "$DIR/RPCS3" -type f \( -iname '*.pup' -o -iname '*.rap' -o -iname '*.edat' -o -iname '*.rif' -o -iname 'act.dat' -o -iname 'idps*' -o -iname '*.pkg' -o -iname 'eboot.bin' \))
          if [ -n "$bad" ]; then echo "::error::the RPCS3 build has $bad"; exit 1; fi
          cp rpcs3-LICENSE "$DIR/RPCS3/LICENSE.txt"
          {
            echo "RPCS3 $RPCS3_VERSION, the RPCS3 team's official Windows build, unchanged."
            echo "RPCS3 is free software under the GNU General Public License, version 2 (LICENSE.txt)."
            echo
            echo "Its source code is commit $RPCS3_COMMIT of RPCS3:"
            echo "  https://github.com/RPCS3/rpcs3/tree/$RPCS3_COMMIT"
            echo "  (git clone https://github.com/RPCS3/rpcs3, then in it: git checkout $RPCS3_COMMIT and git submodule update --init --recursive)"
            echo "This build: https://github.com/RPCS3/rpcs3-binaries-win/releases/tag/$tag ($RPCS3_FILE, SHA-256 $RPCS3_SHA256)"
            echo
            echo "RetroPixels starts RPCS3 as a separate program; it is not part of RetroPixels and RetroPixels does not change it."
            echo "No PlayStation 3 system software, keys, licences or games are included."
          } > "$DIR/RPCS3/SOURCE.txt"
          # RetroPixels' marker: this is its bundled copy (first line: the build).
          {
            echo "RPCS3 $RPCS3_VERSION (${RPCS3_COMMIT:0:8})"
            echo "https://github.com/RPCS3/rpcs3-binaries-win/releases/tag/$tag"
            echo "$RPCS3_FILE sha256 $RPCS3_SHA256"
            echo "RetroPixels copies this folder to %APPDATA%\RetroPixels\RPCS3 and runs it from there; it never runs it from here."
          } > "$DIR/RPCS3/RETROPIXELS-BUNDLED.txt"
          echo "RPCS3 $RPCS3_VERSION (RPCS3/rpcs3-binaries-win $tag)" >> engines.txt

      - name: Package
        run: |
          cp README.txt CHANGELOG.txt LICENSE.txt THIRD-PARTY-NOTICES.txt "$DIR/"
          cp pixelu/LICENSE.txt "$DIR/LICENSE-MPL-2.0.txt"
          cp wiiu/testdata/demo.rpx "$DIR/RetroPixels Wii U demo.rpx"
          {
            if [ "${{ inputs.release }}" = true ]; then
              echo "RetroPixels $VER"
              src="https://github.com/$GITHUB_REPOSITORY/tree/v$VER"
            else
              echo "RetroPixels $VER (test build, not a release)"
              src="https://github.com/$GITHUB_REPOSITORY/tree/$BRANCH"
            fi
            echo "Built $(date -u +%F) from branch $BRANCH ($(git rev-parse --short HEAD))"
            echo
            echo "RetroPixels is Copyright Shredder565, all rights reserved (LICENSE.txt). Third-party components keep their own licences (THIRD-PARTY-NOTICES.txt)."
            echo
            echo "Everything plays inside RetroPixels. Its engines are in the folders next to it:"
            echo "- PixelU\\PixelU.exe: Wii U (original engine rewritten from a Cemu start; Cemu's game profiles and translations are MPL-2.0, LICENSE-MPL-2.0.txt)"
            echo "- PixelU\\wii\\PixelU-Wii.exe: GameCube and Wii (original engine rewritten from a Dolphin start, GPL-2.0-or-later, PixelU\\wii\\license.txt)"
            echo "- MAME: arcade games (the MAME team's official release, GPL-2.0-or-later)"
            echo "- Supermodel\\supermodel.exe: Sega Model 3 (Star Wars Trilogy Arcade). RetroPixels' own Model 3 engine (Supermodel for RetroPixels), LICENSE.txt; its third-party parts in THIRD-PARTY-NOTICES.txt"
            echo "- RPCS3\\rpcs3.exe: PlayStation 3 (the RPCS3 team's official build, unchanged, GPL-2.0, RPCS3\\LICENSE.txt; its source: RPCS3\\SOURCE.txt). RetroPixels runs it from %APPDATA%\\RetroPixels\\RPCS3"
            echo "Engine builds used:"
            sed 's/^/  /' engines.txt
            echo
            echo "Source: $src"
            echo "PixelU-Wii source is in pixelu/wii; docs/pixelu-wii-original.md explains the rewrite and lists the third-party parts and kept Dolphin data."
            echo "No games, keys, BIOS or firmware are included."
          } > "$DIR/VERSION.txt"
          # No zip of our own: GitHub zips the artifact on download, so the
          # folder is uploaded as it is and the download is one zip holding
          # the RetroPixels-<ver> folder (not a zip inside a zip).
          ls -la dist
          cat "$DIR/VERSION.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: RetroPixels-${{ env.VER }}
          path: |
            dist/
            !dist/*.tar.gz
          compression-level: 6
          retention-days: 14

      # Release only: the files release.yml publishes.
      - name: Release files
        if: inputs.release
        run: |
          mkdir -p release
          (cd dist && zip -qr "../release/RetroPixels-$VER.zip" "RetroPixels-$VER")
          cp "$DIR/RetroPixels.exe" "$DIR/RetroPixels-Native.exe" release/
          cp dist/mame-source.tar.gz "release/MAME-${{ steps.mame.outputs.version }}-source.tar.gz"
          cp "$DIR/VERSION.txt" release/VERSION.txt
          ls -la release

      - if: inputs.release
        uses: actions/upload-artifact@v4
        with:
          name: RetroPixels-release
          path: release/
          compression-level: 0
          retention-days: 30

      # One download per run: the Supermodel build (this run's artifact,
      # already copied into the bundle above) is deleted, so the run lists
      # only RetroPixels-<ver> (and, for a release, RetroPixels-release).
      # Nothing after this step needs it; it also expires after a day.
      - name: Remove the intermediate artifacts
        run: |
          for name in Supermodel-windows-x64 Supermodel-linux-x64; do
            ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" --jq ".artifacts[] | select(.name == \"$name\") | .id")
            for id in $ids; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && echo "removed $name ($id)" || echo "::warning::couldn't remove $name ($id); it expires in a day"
            done
          done
